name: Repository checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Repository quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validate Bash syntax
        run: bash -n scripts/install-pgvector.sh

      - name: Lint shell script
        run: shellcheck --severity=warning scripts/install-pgvector.sh

      - name: Check local Markdown links
        run: python3 scripts/check-markdown-links.py
